# Run the extension's tests, with coverage, against a source checkout of Smarter, and upload the
# coverage report to Codecov. The tests call the tools directly, with the helpers in
# smarter.apps.llmtool.extension.testing, so they need Smarter's code and libraries, but not its
# database, Redis or Django setup.
#
# SMARTER_REF is the branch or tag of smarter-sh/smarter whose code the tests run against: main,
# the latest release. Set it to alpha to test against unreleased changes to the Extension framework.
# The "Upload coverage to Codecov" step uses the CODECOV_TOKEN secret.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SMARTER_REF: main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check out Smarter
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: smarter-sh/smarter
          ref: ${{ env.SMARTER_REF }}
          path: .smarter
          sparse-checkout: |
            smarter/smarter
            smarter/requirements

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .smarter/smarter/requirements/base.txt

      - name: Install Smarter's libraries
        run: pip install -r .smarter/smarter/requirements/base.txt coverage

      - name: Unit tests, with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.smarter/smarter
        run: |
          python -m coverage run --source=. --omit='tests/*,scripts/*,.smarter/*' -m unittest discover -s tests -t . -v
          python -m coverage report
          python -m coverage xml -o coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
